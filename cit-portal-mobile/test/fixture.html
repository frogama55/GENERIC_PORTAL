<!DOCTYPE html>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexPortal Mobile 動作確認用の模擬ページ</title>
<!--
  ポータルにログインせずに，ビルドしたユーザースクリプトの基本動作（スタイル適用・設定パネル・
  ローディング表示）を手元で確かめるための模擬ページ．docs/selectors.md の構造をまねた最小限のHTML．
  実データは含まない．使い方：cit-portal-mobile で `python3 -m http.server 8765` → /test/fixture.html
-->
<script>
  // ページ側 jQuery の最小限の代用品（page-bridge.js が購読できれば十分）
  (function () {
    const handlers = {};
    function $() {
      return {
        on(names, fn) { names.split(" ").forEach((n) => (handlers[n] = handlers[n] || []).push(fn)); },
        trigger(name) { (handlers[name] || []).forEach((fn) => fn()); },
      };
    }
    $.fn = {};
    window.jQuery = $;
    window.fakeAjax = function (ms) {
      $().trigger("pfAjaxSend");
      setTimeout(() => $().trigger("pfAjaxComplete"), ms || 1200);
    };
  })();
</script>
<script src="../dist/nexportal-mobile.user.js"></script>
</head>
