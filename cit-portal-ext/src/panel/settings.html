<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexPortal 設定</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <h1>NexPortal</h1>
  <p class="note">大学ポータルの見た目・表示動作を見やすく整える非公式の拡張です．<br>データの外部送信は一切しません．</p>

  <div class="disclaimer">
    ⚠️ <strong>使用は自己責任でお願いします．</strong>読み取り専用で実データは変更しませんが，
    表示が誤ることはあります．単位・出席・成績など重要な情報は，必ず本来のポータル画面でも
    確認してください．
  </div>

  <section>
    <h2>基本</h2>

    <label class="row">
      <input type="checkbox" id="enabled">
      <span>拡張機能を有効にする<br><small>OFFにすると全機能が止まり，元のポータル表示に戻ります</small></span>
    </label>

    <label class="row row-indent">
      <input type="checkbox" id="largeText">
      <span>文字を少し大きくする</span>
    </label>
  </section>

  <section>
    <h2>ページ別の機能</h2>

    <label class="row">
      <input type="checkbox" id="topPage">
      <span>トップページを刷新<br><small>クイックランチャー＋スケジュール＋掲示に整理</small></span>
    </label>

    <label class="row">
      <input type="checkbox" id="gradesYearTerm">
      <span>成績を年度学期表示で開く<br><small>分類別ではなく年度学期別を既定にする</small></span>
    </label>

    <label class="row">
      <input type="checkbox" id="attachInline">
      <span>添付ファイルをブラウザ内で表示<br><small>DLせず閲覧．保存も可（ポータルからのみ取得・外部送信なし）</small></span>
    </label>

    <label class="row">
      <input type="checkbox" id="reloginButton">
      <span>自動ログアウト画面に再ログインボタン<br><small>ログインページへ1クリックで移動（パスワードは保存しません）</small></span>
    </label>
  </section>

  <footer>
    <a href="https://github.com/frogama55/GENERIC_PORTAL/blob/main/cit-portal-ext/PRIVACY_POLICY.md" target="_blank" rel="noopener">プライバシーポリシー</a>
    <span class="dot">・</span>
    <a href="https://github.com/frogama55/GENERIC_PORTAL" target="_blank" rel="noopener">リポジトリ</a>
    <span class="version" id="version"></span>
  </footer>

  <script src="settings.js"></script>
</body>
</html>
